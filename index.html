<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>My Blog</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <!-- ヘッダー -->
        <header class="header">
            <h1>📝 My Blog</h1>
            <p class="subtitle">技術とコードについての記事</p>
        </header>

        <!-- 記事投稿フォーム -->
        <section class="add-post-section">
            <h2>新しい記事を追加</h2>
            <form id="postForm" class="post-form">
                <div class="form-group">
                    <label for="title">タイトル</label>
                    <input type="text" id="title" name="title" required placeholder="記事のタイトルを入力">
                </div>
                <div class="form-group">
                    <label for="content">内容</label>
                    <textarea id="content" name="content" required placeholder="記事の内容を入力" rows="6"></textarea>
                </div>
                <div class="form-group">
                    <label for="author">著者名</label>
                    <input type="text" id="author" name="author" required placeholder="著者名を入力">
                </div>
                <button type="submit" class="btn-submit">記事を投稿</button>
            </form>
        </section>

        <!-- 記事一覧 -->
        <section class="posts-section">
            <h2>記事一覧</h2>
            <div id="postsContainer" class="posts-container">
                <!-- ここに記事が動的に表示されます -->
            </div>
        </section>
    </div>

    <script src="script.js"></script>
</body>
</html>
